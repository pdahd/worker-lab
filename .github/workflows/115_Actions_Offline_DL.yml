# ===== 115_Actions_Offline_DL v1.0.1 =====
# 变更: 文件名输入框可留空, 自动从直链解析(含中文URL解码); 其余同 v1.0.0
name: 115 Offline DL
on:
  workflow_dispatch:
    inputs:
      url:
        description: '115直链(取链后24h内有效)'
        required: true
      filename:
        description: '文件名(留空=自动从直链解析)'
        required: false
        default: ''
      ua:
        description: '取链页面UA(默认已填,一般不用改)'
        required: false
        default: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36 Edg/151.0.4129.101'

permissions: {}
concurrency:
  group: 115-dl-one-at-a-time
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      URL: ${{ inputs.url }}
      NAME: ${{ inputs.filename }}
      UA: ${{ inputs.ua }}
    steps:
      - name: 解析文件名(输入为空时取自直链)
        run: |
          if [ -z "$NAME" ]; then
            BASE="${URL##*/}"          # 取最后一个 / 之后
            BASE="${BASE%%\?*}"        # 去掉 ? 查询串
            BASE="${BASE%%#*}"         # 去掉 # 锚点
            NAME=$(python3 -c "import urllib.parse,sys;print(urllib.parse.unquote(sys.argv[1]))" "$BASE")
          fi
          if [ -z "$NAME" ]; then
            echo "::error::无法从直链解析文件名, 请手动填写 filename"; exit 1
          fi
          echo "使用文件名: $NAME"
          echo "NAME=$NAME" >> "$GITHUB_ENV"

      - name: 确保 aria2 存在
        run: which aria2c || (sudo apt-get update -qq && sudo apt-get install -y -qq aria2)

      - name: 下载(双连接≈150KiB/s)
        run: |
          aria2c -x2 -s2 -k4M --file-allocation=none \
            --user-agent="$UA" \
            --dir="$GITHUB_WORKSPACE/dl" \
            -o "$NAME" \
            --summary-interval=120 --console-log-level=warn \
            "$URL"

      - name: 生成校验文件
        run: |
          cd dl
          md5sum "$NAME" | tee md5.txt
          ls -lh
      - name: 上传工件(保留1天, 零压缩)
        uses: actions/upload-artifact@v4
        with:
          name: files
          path: dl/*
          retention-days: 1
          compression-level: 0
